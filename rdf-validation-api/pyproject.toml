[project]
name = "rdf-validation-api"
version = "1.0.0"
description = "PLLOD RDF Validation and Quality Assessment API"
requires-python = ">=3.15"
dependencies = [
    "aiohttp>=3.14.5",
    "fastapi[standard]>=0.162.0",
    "pydantic>=2.14.2",
    "pyshacl>=0.40.2",
    "rdflib>=7.6.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[tool.uv]
# Applicazione, non libreria: uv installa solo le dipendenze, non il progetto
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
