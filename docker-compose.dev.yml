# 💻 Ambiente di SVILUPPO — si usa con .env.dev (make dev-*)
#   docker compose -f docker-compose.dev.yml --env-file .env.dev ...
#
# Progetto "pllod-dev" (volumi pllod-dev_*): separato dalla produzione anche sulla stessa macchina.
# Per cambiarlo imposta COMPOSE_PROJECT_NAME in .env.dev.
# Container e hostname seguono lo schema pllod-dev-<servizio>: sono i nomi da usare in .env.dev.
name: pllod-dev

services:
  # MariaDB (solo rete interna llod_data)
  mariadb:
    image: mariadb:13.0.2
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    container_name: pllod-dev-mariadb
    hostname: pllod-dev-mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      # Aggiorna le tabelle di sistema dei dati creati con versioni precedenti
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - llod_data
    healthcheck:
      test: ["CMD", "mariadb", "-u", "root", "-p${DB_ROOT_PASSWORD}", "-e", "SELECT 1"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 10

  # Redis per code e cache (solo rete interna llod_data)
  redis:
    image: redis:8.10.3-alpine
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    container_name: pllod-dev-redis
    hostname: pllod-dev-redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - llod_data

  # Laravel (serversideup/php 8.5 fpm-nginx), codice montato dall'host
  laravel_app:
    build:
      context: .
      dockerfile: ./docker/laravel/Dockerfile
      target: development
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
      platforms:
        - ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    container_name: pllod-dev-app
    hostname: pllod-dev-app
    restart: always
    environment:
      AUTORUN_ENABLED: "true"
      AUTORUN_LARAVEL_MIGRATION_SEED: "true"
      AUTORUN_LARAVEL_OPTIMIZE: "false"
      AUTORUN_LARAVEL_CONFIG_CACHE: "false"
      AUTORUN_LARAVEL_ROUTE_CACHE: "false"
      AUTORUN_LARAVEL_VIEW_CACHE: "false"
      AUTORUN_LARAVEL_EVENT_CACHE: "false"
    volumes:
      - ./pllod-app/:/var/www/html
      # Sintassi estesa: se .env.dev manca Docker dà errore invece di creare una cartella vuota
      - type: bind
        source: ./.env.dev
        target: /var/www/html/.env
        read_only: true
    ports:
      - "127.0.0.1:${LARAVEL_PORT:-8080}:8080"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - llod_network
      - llod_data
      - llod_graph

  # Horizon (code Redis)
  laravel_horizon:
    build:
      context: .
      dockerfile: ./docker/laravel/Dockerfile
      target: development
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
      platforms:
        - ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    container_name: pllod-dev-horizon
    hostname: pllod-dev-horizon
    restart: always
    command: ["php", "/var/www/html/artisan", "horizon"]
    stop_signal: SIGTERM
    environment:
      AUTORUN_ENABLED: "false"
      DEV_SETUP_ENABLED: "false"
    volumes:
      - ./pllod-app/:/var/www/html
      - type: bind
        source: ./.env.dev
        target: /var/www/html/.env
        read_only: true
    healthcheck:
      test: ["CMD", "healthcheck-horizon"]
      start_period: 10s
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
      laravel_app:
        condition: service_healthy
    networks:
      - llod_network
      - llod_data
      - llod_graph

  # API Python di validazione RDF: codice montato con reload automatico, nessuna porta pubblicata
  # (test: make dev-py-test)
  python_api:
    build:
      context: ./rdf-validation-api
      dockerfile: Dockerfile
      target: development
      platforms:
        - ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    container_name: pllod-dev-python-api
    hostname: pllod-dev-python-api
    restart: always
    volumes:
      - ./rdf-validation-api:/app
    networks:
      - llod_network

  # VocBench 3 / Semantic Turkey: il browser lo apre su http://localhost:1979/vocbench3
  vocbench3:
    container_name: pllod-dev-vocbench
    hostname: pllod-dev-vocbench
    restart: always
    build:
      context: ./vocbench3-docker/14.0.0
      platforms:
        - ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    ports:
    - "127.0.0.1:1979:1979"
    volumes:
     - type: bind
       source: ${VB_DATA_DIR:-./vocbench3-docker/volumes}/stdata
       target: /opt/vocbench3/data
    depends_on:
      - graphdb
    networks:
      - llod_network
      - llod_graph

  # GraphDB (solo rete interna llod_graph)
  graphdb:
    container_name: pllod-dev-graphdb
    hostname: pllod-dev-graphdb
    restart: always
    build:
      context: ./vocbench3-docker/helpers/graphdb-with-st-sails
      platforms:
        - ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    volumes:
     - type: bind
       source: ${VB_DATA_DIR:-./vocbench3-docker/volumes}/gdbhome
       target: /opt/graphdb/home
    networks:
      - llod_graph

volumes:
  mariadb_data:
  redis_data:

networks:
  # Unica rete con accesso a internet e porte pubblicate
  llod_network:
    driver: bridge
  # Reti interne (internal: niente internet, niente porte pubblicate): i servizi si chiamano per nome
  llod_data:
    driver: bridge
    internal: true
  llod_graph:
    driver: bridge
    internal: true
