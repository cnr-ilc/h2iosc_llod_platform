services:
  # MariaDB Database for Laravel
  mariadb:
    image: mariadb:13.0.2
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    container_name: llod_mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      # Aggiorna le tabelle di sistema dei dati creati con MariaDB 10.11
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - llod_network
    healthcheck:
      test: ["CMD", "mariadb", "-u", "root", "-p${DB_ROOT_PASSWORD}", "-e", "SELECT 1"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 10

  # Redis for Laravel queues and caching
  redis:
    image: redis:8.10.3-alpine
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    container_name: llod_redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - llod_network

  # Laravel Application (serversideup/php 8.5 fpm-nginx)
  laravel_app:
    build:
      context: .
      dockerfile: ./docker/laravel/Dockerfile
      target: development
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
      platforms:
        - ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    container_name: llod_laravel_app
    restart: always
    environment:
      AUTORUN_ENABLED: "true"
      AUTORUN_LARAVEL_MIGRATION_SEED: "true"
      AUTORUN_LARAVEL_OPTIMIZE: "false"
      AUTORUN_LARAVEL_CONFIG_CACHE: "false"
      AUTORUN_LARAVEL_ROUTE_CACHE: "false"
      AUTORUN_LARAVEL_VIEW_CACHE: "false"
      AUTORUN_LARAVEL_EVENT_CACHE: "false"
    volumes:
      - ./pllod-app/:/var/www/html
      - .env:/var/www/html/.env
    ports:
      - "127.0.0.1:${LARAVEL_PORT:-8080}:8080"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - llod_network

  # Laravel Horizon for queue processing
  laravel_horizon:
    build:
      context: .
      dockerfile: ./docker/laravel/Dockerfile
      target: development
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
      platforms:
        - ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    container_name: llod_laravel_horizon
    restart: always
    command: ["php", "/var/www/html/artisan", "horizon"]
    stop_signal: SIGTERM
    environment:
      AUTORUN_ENABLED: "false"
      DEV_SETUP_ENABLED: "false"
    volumes:
      - ./pllod-app/:/var/www/html
      - .env:/var/www/html/.env
    healthcheck:
      test: ["CMD", "healthcheck-horizon"]
      start_period: 10s
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
      laravel_app:
        condition: service_healthy
    networks:
      - llod_network

  # Python RDF Validation API
  python_api:
    build:
      context: ./rdf-validation-api
      dockerfile: Dockerfile
      platforms:
        - ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    ports:
      - "8000:8000"
    container_name: llod_python_api
    restart: always
    volumes:
      - ./rdf-validation-api:/app
    networks:
      - llod_network

  vocbench3:
    container_name: vocbench
    restart: always
    build:
      context: ./vocbench3-docker/14.0.0
      platforms:
        - ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    ports:
    - "127.0.0.1:1979:1979"
    volumes:
     - type: bind
       source: ./vocbench3-docker/volumes/stdata
       target: /opt/vocbench3/data
    depends_on:
      - graphdb
    networks:
      - llod_network

  graphdb:
    container_name: graphdb
    restart: always
    build:
      context: ./vocbench3-docker/helpers/graphdb-with-st-sails
      platforms:
        - ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    ports:
     - "127.0.0.1:7200:7200"
    volumes:
     - type: bind
       source: ./vocbench3-docker/volumes/gdbhome
       target: /opt/graphdb/home
    networks:
      - llod_network

volumes:
  mariadb_data:
  redis_data:
  pllod-storage:

networks:
  llod_network:
    driver: bridge 