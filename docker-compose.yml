services:
  # MariaDB Database for Laravel
  mariadb:
    image: mariadb:10.11
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    container_name: llod_mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - llod_network
    healthcheck:
      test: ["CMD", "mysql", "-u", "root", "-p${DB_ROOT_PASSWORD}", "-e", "SELECT 1"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 10

  # Redis for Laravel queues and caching
  redis:
    image: redis:7-alpine
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    container_name: llod_redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - llod_network

  # Laravel Application
  laravel_app:
    build:
      context: .
      dockerfile: ./docker/laravel/production/Dockerfile
      platforms:
        - ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    container_name: llod_laravel_app
    restart: always
    working_dir: /var/www/html
    volumes:
      - ./docker/laravel/production/php.ini:/usr/local/etc/php/conf.d/custom.ini
      - pllod-storage:/var/www/html/storage
    ports:
      - "127.0.0.1:${LARAVEL_PORT:-8080}:80"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - llod_network

  # Laravel Horizon for queue processing
  laravel_horizon:
    build:
      context: .
      dockerfile: ./docker/laravel/production/Dockerfile
      platforms:
        - ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    container_name: llod_laravel_horizon
    restart: always
    working_dir: /var/www/html
    volumes:
      - ./docker/laravel/production/php.ini:/usr/local/etc/php/conf.d/custom.ini
      - pllod-storage:/var/www/html/storage
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
      laravel_app:
        condition: service_started
    entrypoint: ["/usr/local/bin/horizon-entrypoint.sh"]
    networks:
      - llod_network

  # Python RDF Validation API
  python_api:
    build:
      context: ./rdf-validation-api
      dockerfile: Dockerfile
      platforms:
        - ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    container_name: llod_python_api
    restart: always
    volumes:
      - ./rdf-validation-api:/app
    networks:
      - llod_network

  vocbench3:
    container_name: vocbench
    restart: always
    build:
      context: ./vocbench3-docker/14.0.0
      platforms:
        - ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    ports:
    - "127.0.0.1:1979:1979"
    volumes:
     - type: bind
       source: ./vocbench3-docker/volumes/stdata
       target: /opt/vocbench3/data
    depends_on:
      - graphdb
    networks:
      - llod_network

  graphdb:
    restart: always
    build:
      context: ./vocbench3-docker/helpers/graphdb-with-st-sails
      platforms:
        - ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    ports:
     - "127.0.0.1:7200:7200"
    volumes:
     - type: bind
       source: ./vocbench3-docker/volumes/gdbhome
       target: /opt/graphdb/home
    networks:
      - llod_network

volumes:
  mariadb_data:
  redis_data:
  pllod-storage:

networks:
  llod_network:
    driver: bridge 